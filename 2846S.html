<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0b1220;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      background: #131e30;
      border: 1px solid #29374d;
      border-radius: 18px;
      box-shadow: 0 15px 45px #0004;
    }
    h2 { margin: 0 0 8px; text-align: center; }
    .sub {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #334155;
      border-radius: 9px;
      background: #0b1220;
      color: white;
      outline: none;
      font-size: 15px;
    }
    input:focus { border-color: #3b82f6; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .success { display: block !important; background: #123a2c; color: #86efac; }
    .error { display: block !important; background: #451a22; color: #fca5a5; }
    .note {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <h2>إنشاء حساب جديد</h2>
    <div class="sub">أنشئ حسابك للبدء</div>

    <form id="registerForm">
      <label for="name">الاسم</label>
      <input id="name" type="text" autocomplete="name"
             maxlength="80" required placeholder="أدخل اسمك">

      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email"
             required placeholder="name@example.com">

      <label for="password">كلمة المرور</label>
      <input id="password" type="password"
             autocomplete="new-password" minlength="8"
             required placeholder="8 أحرف على الأقل">

      <label for="confirm">تأكيد كلمة المرور</label>
      <input id="confirm" type="password"
             autocomplete="new-password" minlength="8"
             required placeholder="أعد كتابة كلمة المرور">

      <button id="submitBtn" type="submit">إنشاء الحساب</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
    <div class="note">
      تُنشأ الحسابات بصلاحية مستخدم عادي. لا تُدخل بيانات حساسة
      إلا على موقعك الرسمي وبعد التأكد من إعدادات الأمان.
    </div>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    // ضع إعدادات مشروع Firebase الخاص بك هنا.
    const firebaseConfig = {
      apiKey: "AIzaSyBbGpHW0ItpWrffXntHaF_BP8A2NjaLC6w",
      authDomain: "gen-lang-client-0589567342.firebaseapp.com",
      projectId: "gen-lang-client-0589567342",
      appId: "1:384258034144:web:dd06e26ce38651190c4385"
    };

    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");
    const form = document.getElementById("registerForm");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    let auth;

    try {
      if (
        !firebaseConfig.apiKey.startsWith("YOUR_") &&
        !firebaseConfig.projectId.startsWith("YOUR_") &&
        !firebaseConfig.appId.startsWith("YOUR_")
      ) {
        auth = getAuth(initializeApp(firebaseConfig));
      }
    } catch {
      auth = null;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (!auth) {
        showMessage(
          "يجب وضع إعدادات Firebase الصحيحة أولاً.",
          "error"
        );
        return;
      }

      if (!name) {
        showMessage("يرجى إدخال الاسم.", "error");
        return;
      }

      if (password !== confirm) {
        showMessage("كلمتا المرور غير متطابقتين.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "جارٍ إنشاء الحساب...";

      try {
        const credential = await createUserWithEmailAndPassword(
          auth, email, password
        );

        await updateProfile(credential.user, {
          displayName: name
        });

        showMessage(
          "تم إنشاء الحساب بنجاح. معرّف المستخدم: " +
          credential.user.uid,
          "success"
        );

        form.reset();
      } catch (error) {
        const errors = {
          "auth/email-already-in-use": "هذا البريد مسجل مسبقاً.",
          "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة.",
          "auth/weak-password": "كلمة المرور ضعيفة.",
          "auth/operation-not-allowed":
            "إنشاء الحساب بالبريد غير مفعّل في Firebase.",
          "auth/network-request-failed":
            "تعذر الاتصال. تحقق من الإنترنت.",
          "auth/too-many-requests":
            "محاولات كثيرة. انتظر قليلاً ثم حاول مجدداً.",
          "auth/invalid-api-key":
            "مفتاح Firebase غير صحيح."
        };

        showMessage(
          errors[error.code] ||
          "تعذر إنشاء الحساب. رمز الخطأ: " +
          (error.code || "unknown"),
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "إنشاء الحساب";
      }
    });
  </script>
</body>
</html>
