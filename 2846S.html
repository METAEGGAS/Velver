
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنشاء حساب الإدارة</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #111827; color: #fff;
      font-family: Arial, sans-serif; padding: 20px;
    }
    .card {
      width: 100%; max-width: 370px; padding: 26px;
      background: #1f2937; border: 1px solid #374151;
      border-radius: 18px;
    }
    h2 { margin: 0 0 8px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.7; }
    label { display: block; margin: 16px 0 7px; font-size: 14px; }
    input, button {
      width: 100%; padding: 13px; border-radius: 9px;
      font-size: 15px;
    }
    input {
      background: #111827; color: white;
      border: 1px solid #4b5563; outline: none;
    }
    button {
      margin-top: 20px; border: 0; background: #6366f1;
      color: white; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #msg { margin-top: 15px; font-size: 14px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h2>إنشاء حساب الإدارة</h2>
    <p>أنشئ حسابًا جديدًا باستخدام بيانات البريد الإلكتروني.</p>

    <form id="registerForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email"
        value="ttwt09191@gmail.com" required autocomplete="email">

      <label for="password">كلمة المرور</label>
      <input id="password" type="password"
        value="05318352256" required minlength="6"
        autocomplete="new-password">

      <button id="submitBtn" type="submit">إنشاء حساب جديد</button>
      <div id="msg" role="status"></div>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getFirestore, doc, setDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBbGpHW0ItpWrffXntHaF_BP8A2NjaLC6w",
      authDomain: "gen-lang-client-0589567342.firebaseapp.com",
      projectId: "gen-lang-client-0589567342",
      storageBucket: "gen-lang-client-0589567342.firebasestorage.app",
      messagingSenderId: "384258034144",
      appId: "1:384258034144:web:dd06e26ce38651190c4385"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app, 
      "ai-studio-goldrixdigitalas-80bc2c2b-b4d6-4bcc-9fdd-4715b1d01508");

    const form = document.getElementById("registerForm");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      btn.disabled = true;
      msg.textContent = "جارٍ إنشاء الحساب...";
      msg.style.color = "#d1d5db";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const credential = await createUserWithEmailAndPassword(
          auth, email, password
        );

        msg.style.color = "#86efac";
        msg.textContent =
          "تم إنشاء الحساب بنجاح. UID: " + credential.user.uid +
          ". لم تُمنح صلاحية الإدارة تلقائيًا.";

      } catch (error) {
        const errors = {
          "auth/email-already-in-use": "هذا البريد مسجل مسبقًا.",
          "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة.",
          "auth/weak-password": "كلمة المرور ضعيفة.",
          "auth/operation-not-allowed": "فعّل Email/Password من إعدادات Firebase Authentication.",
          "auth/network-request-failed": "تحقق من اتصال الإنترنت."
        };
        msg.style.color = "#fca5a5";
        msg.textContent = errors[error.code] ||
          ("تعذر إنشاء الحساب: " + error.message);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
